    <style>
        :root {
            --global-navy: #0f172a;
            --global-red: #e31b23;
            --page-bg: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: rgba(255, 255, 255, 0.8);
            --hero-bg: #0f172a;
            --panel-bg: #f8fafc;
            --panel-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-soft: #94a3b8;
            --btn-neutral-bg: #f8fafc;
            --btn-neutral-text: #334155;
            --btn-neutral-border: #e2e8f0;
            --btn-accent-bg: #fef2f2;
            --btn-accent-text: #e31b23;
            --btn-accent-border: #fecaca;
            --splash-bg: #0f172a;
        }

        body[data-theme='dark'] {
            --page-bg: #050505;
            --card-bg: #0f172a;
            --card-border: rgba(148, 163, 184, 0.18);
            --hero-bg: #020617;
            --panel-bg: #111827;
            --panel-border: rgba(148, 163, 184, 0.16);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-soft: #94a3b8;
            --btn-neutral-bg: #111827;
            --btn-neutral-text: #e2e8f0;
            --btn-neutral-border: rgba(148, 163, 184, 0.2);
            --btn-accent-bg: rgba(227, 27, 35, 0.18);
            --btn-accent-text: #fecdd3;
            --btn-accent-border: rgba(227, 27, 35, 0.4);
            --splash-bg: #050505;
        }

        * { -webkit-tap-highlight-color: transparent; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(227, 27, 35, 0.08), transparent 40%),
                var(--page-bg);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ============ PRELOADER / SPLASH ============ */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--splash-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash.hidden-splash {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo {
            width: 84px;
            height: 84px;
            border-radius: 1.4rem;
            background: linear-gradient(135deg, #e31b23 0%, #7f1d1d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(227, 27, 35, 0.35);
            animation: splash-pop 0.7s cubic-bezier(.2,.8,.2,1) both;
        }

        .splash-logo svg { width: 42px; height: 42px; color: #fff; }

        .splash-name {
            color: #f8fafc;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-size: 0.8rem;
            animation: splash-fade 0.8s ease 0.25s both;
        }

        .splash-bar {
            width: 180px;
            height: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
            animation: splash-fade 0.8s ease 0.4s both;
        }

        .splash-bar span {
            display: block;
            height: 100%;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, #e31b23, #f87171);
            animation: splash-load 1.1s ease-in-out infinite;
        }

        @keyframes splash-pop {
            from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes splash-fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes splash-load {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }

        /* ============ ENTRADA ESCALONADA ============ */
        .reveal {
            opacity: 0;
            transform: translateY(22px);
            filter: blur(6px);
        }

        .reveal-in {
            animation: reveal-up 0.75s cubic-bezier(.2,.8,.2,1) forwards;
            animation-delay: var(--d, 0s);
        }

        @keyframes reveal-up {
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* ============ TARJETA ============ */
        .card-shell {
            transform-style: preserve-3d;
            perspective: 1200px;
            animation: card-enter 0.8s cubic-bezier(.2,.8,.2,1) 0.15s both;
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(26px) scale(0.97); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .tilt-surface {
            transition: transform 180ms ease, box-shadow 180ms ease;
            will-change: transform;
        }

        .theme-card { background: var(--card-bg); border-color: var(--card-border); }
        .theme-hero { background-color: var(--hero-bg); }
        .theme-panel { background-color: var(--panel-bg); border-color: var(--panel-border); }
        .theme-text-main { color: var(--text-main); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-text-soft { color: var(--text-soft); }

        .theme-btn-neutral {
            background-color: var(--btn-neutral-bg);
            border-color: var(--btn-neutral-border);
            color: var(--btn-neutral-text);
        }

        .theme-btn-accent {
            background-color: var(--btn-accent-bg);
            border-color: var(--btn-accent-border);
            color: var(--btn-accent-text);
        }

        .bg-global-navy { background-color: var(--global-navy); }
        .text-global-red { color: var(--global-red); }
        .bg-global-red { background-color: var(--global-red); }

        /* ============ HERO ============ */
        .floating-orb { animation: float-y 7s ease-in-out infinite; }
        .floating-orb.delay-1 { animation-delay: -2s; }
        .floating-orb.delay-2 { animation-delay: -4s; }

        @keyframes float-y {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
        }

        .shine { position: relative; overflow: hidden; }

        .shine::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.22) 50%, transparent 80%);
            transform: translateX(-120%);
            animation: sheen 6.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sheen {
            0%, 35% { transform: translateX(-120%); }
            60%, 100% { transform: translateX(120%); }
        }

        .avatar-ring {
            animation: pulse-ring 4.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 50px rgba(15,23,42,.18); }
            50% { transform: scale(1.025); box-shadow: 0 24px 60px rgba(15,23,42,.28); }
        }

        .status-pill { animation: subtle-bounce 5s ease-in-out infinite; }

        @keyframes subtle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        /* ============ BOTONES ============ */
        .pressable {
            transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, border-color 160ms ease;
            will-change: transform;
        }

        .pressable:hover { transform: translateY(-2px) scale(1.01); }
        .pressable:active { transform: translateY(1px) scale(0.97); }

        .pressable-icon { transition: transform 180ms ease, filter 180ms ease; }
        .pressable:hover .pressable-icon { transform: scale(1.08) rotate(-4deg); }
        .pressable:active .pressable-icon { transform: scale(0.95); }

        .ripple-ink {
            position: absolute;
            border-radius: 9999px;
            background: rgba(255,255,255,0.35);
            transform: scale(0);
            pointer-events: none;
            transition: transform 550ms ease, opacity 550ms ease;
        }

        /* ============ SOCIAL ============ */
        .social-dot {
            transition: transform 180ms ease, background-color 180ms ease, color 180ms ease;
        }

        .social-dot:hover {
            transform: translateY(-3px) scale(1.06);
            background-color: var(--global-red);
            color: #fff;
        }

        /* ============ QR ============ */
        #qr-image { transition: transform 0.4s ease; }
        #qrcode:hover #qr-image { transform: scale(1.05) rotate(1deg); }

        /* ============ FOOTER BADGE ============ */
        .theme-footer-badge {
            background-color: var(--card-bg);
            color: var(--text-soft);
            border-color: var(--panel-border);
        }

        .safe-bottom { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }

        body[data-theme='dark'] .shine::after {
            background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.10) 50%, transparent 80%);
        }

        body[data-theme='dark'] .avatar-ring { box-shadow: 0 18px 45px rgba(0,0,0,0.45); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .reveal { opacity: 1; transform: none; filter: none; }
        }
    </style>
</head>

                bio: 'Especialista en ingeniería y despliegue de redes inalámbricas, con experiencia en diseño, implementación y optimización de infraestructura de conectividad.',
                whatsappMessage: 'Hola Luis, me interesa conocer más sobre los servicios de redes y conectividad.',
                social: {
                    linkedin: '',
                    facebook: '',
                    instagram: ''
                }
            },
            'graciela-gonzalez': {
                firstName: 'Graciela',
                lastName: 'Gonzalez Mejia',
                fullName: 'Graciela Gonzalez Mejia',
                title: 'Gerente de Operaciones',
                company: 'Global Incom',
                phone: '+525578880782',
                email: 'graciela.g@globalincom.com.mx',
                website: 'https://globalincom.com.mx/',
                websiteLabel: 'globalincom.com.mx',
                location: 'Polanco, CDMX',
                photo: 'assets/images/GracielaGonzalez.png',
                bio: 'Gerente de operaciones con amplia experiencia en coordinación de equipos, gestión de procesos y optimización de recursos para garantizar la excelencia en el servicio.',
                whatsappMessage: 'Hola Graciela, me gustaría conocer más sobre los servicios de Global Incom.',
                social: {
                    linkedin: '',
                    facebook: '',
                    instagram: ''
                }
            },
            'ricardo-moreno': {
                firstName: 'Ricardo',
                lastName: 'Moreno Acosta',
                fullName: 'Ricardo Moreno Acosta',
                title: 'Gerente Desarrollo Nuevos Negocios',
                company: 'Global Incom',
                phone: '+525544697416',
                email: 'rmoreno@global-incom.mx',
                website: 'https://globalincom.com.mx/',
                websiteLabel: 'globalincom.com.mx',
                location: 'Polanco, CDMX',
                photo: 'assets/images/RicardoMoreno.png',
                bio: 'Gerente de Desarrollo de Nuevos Negocios con experiencia en identificación de oportunidades, expansión de mercado y diseño de estrategias de crecimiento.',
                whatsappMessage: 'Hola Ricardo, me gustaría conocer más sobre las oportunidades de nuevos negocios en Global Incom.',
                social: {
                    linkedin: '',
                    facebook: '',
                    instagram: ''
                }
            }
        };

        const params = new URLSearchParams(window.location.search);
        const employeeKey = params.get('employee');
        const employee = employeeKey ? employeeCatalog[employeeKey] : null;
        // Construir URL completa dinámicamente (funciona en cualquier dominio/ruta)
        const basePath = window.location.pathname.replace(/index\.html$/, '').replace(/\/$/, '');
        const publicProfileUrl = employeeKey 
            ? `${window.location.origin}${basePath}/?employee=${employeeKey}`
            : `${window.location.origin}${basePath}/`;

        /* ============ REFERENCIAS DOM ============ */
        const cardShell = document.getElementById('card-shell');
        const themeToggle = document.getElementById('theme-toggle');
        const themeToggleLabel = document.getElementById('theme-toggle-label');
        const socialRow = document.getElementById('social-row');

        const elements = {
            photo: document.getElementById('profile-photo'),
            name: document.getElementById('profile-name'),
            title: document.getElementById('profile-title'),
            company: document.getElementById('profile-company'),
            bio: document.getElementById('profile-bio'),
            website: document.getElementById('profile-website'),
            location: document.getElementById('profile-location'),
            call: document.getElementById('action-call'),
            whatsapp: document.getElementById('action-whatsapp'),
            email: document.getElementById('action-email'),
            save: document.getElementById('action-save'),
            share: document.getElementById('share-link'),
            copy: document.getElementById('copy-link'),
            qr: document.getElementById('qr-image'),
        };

        /* ============ TEMA ============ */
        function getPreferredTheme() {
            const urlTheme = params.get('theme');
            const saved = urlTheme || localStorage.getItem('vcard2-theme');
            if (saved === 'light' || saved === 'dark') return saved;
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setTheme(theme) {
            document.body.dataset.theme = theme;
            localStorage.setItem('vcard2-theme', theme);
            const isDark = theme === 'dark';
            themeToggleLabel.textContent = isDark ? 'Modo claro' : 'Modo oscuro';
            themeToggle.innerHTML = isDark
                ? '<i data-lucide="sun-medium" class="w-3.5 h-3.5"></i><span id="theme-toggle-label">Modo claro</span>'
                : '<i data-lucide="moon-star" class="w-3.5 h-3.5"></i><span id="theme-toggle-label">Modo oscuro</span>';
            lucide.createIcons();
        }

        themeToggle.addEventListener('click', () => {
            setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
        });

        /* ============ UTILIDADES ============ */
        function normalizePhone(phone) {
            return phone.replace(/[^\d+]/g, '');
        }

        function buildVCard(data) {
            let lines = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${data.lastName};${data.firstName};;;`,
                `FN:${data.fullName}`,
                `ORG:${data.company}`,
                `TITLE:${data.title}`,
                `TEL;TYPE=WORK,VOICE:${data.phone}`,
                `EMAIL:${data.email}`,
                `URL:${data.website}`
            ];
            if (data.social && data.social.linkedin) {
                lines.push(`X-SOCIALPROFILE;TYPE=linkedin:${data.social.linkedin}`);
            }
            lines.push('NOTE:' + (data.bio || '').replace(/\n/g, '\\n'));
            lines.push('END:VCARD');
            return lines.join('\r\n');
        }

        function downloadVCard(data) {
            const blob = new Blob([buildVCard(data)], { type: 'text/vcard;charset=utf-8' });
            const objectUrl = window.URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.style.display = 'none';
            anchor.href = objectUrl;
            anchor.download = `${data.fullName.replace(/\s+/g, '_')}_vCard.vcf`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            window.URL.revokeObjectURL(objectUrl);
        }

        function shareProfile(data) {
            const shareData = {
                title: data.fullName,
                text: `${data.fullName} - ${data.title}`,
                url: publicProfileUrl
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
                return;
            }
            navigator.clipboard.writeText(publicProfileUrl).then(() => {
                elements.share.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Enlace copiado';
                lucide.createIcons();
                setTimeout(() => {
                    elements.share.innerHTML = '<i data-lucide="share-2" class="w-4 h-4"></i> Compartir perfil';
                    lucide.createIcons();
                }, 1800);
            });
        }

        /* ============ RIPPLE ============ */
        function addRipple(target, clientX, clientY) {
            const bounds = target.getBoundingClientRect();
            const ripple = document.createElement('span');
            const size = Math.max(bounds.width, bounds.height);
            ripple.className = 'ripple-ink';
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.left = `${clientX - bounds.left - size / 2}px`;
            ripple.style.top = `${clientY - bounds.top - size / 2}px`;
            ripple.style.opacity = '0.9';
            target.style.position = 'relative';
            target.style.overflow = 'hidden';
            target.appendChild(ripple);
            requestAnimationFrame(() => {
                ripple.style.transform = 'scale(1)';
                ripple.style.opacity = '0';
            });
            setTimeout(() => ripple.remove(), 600);
        }

        function attachRipple(el) {
            el.addEventListener('pointerdown', (e) => addRipple(el, e.clientX, e.clientY));
        }

        /* ============ TILT 3D ============ */
        function attachTilt(el) {
            if (!el || window.matchMedia('(hover: none)').matches) return;
            el.addEventListener('pointermove', (event) => {
                const b = el.getBoundingClientRect();
                const x = (event.clientX - b.left) / b.width - 0.5;
                const y = (event.clientY - b.top) / b.height - 0.5;
                el.style.transform = `rotateX(${-y * 6}deg) rotateY(${x * 6}deg) translateY(-2px)`;
                el.style.boxShadow = '0 28px 60px rgba(15, 23, 42, 0.18)';
            });
            const reset = () => {
                el.style.transform = '';
                el.style.boxShadow = '';
            };
            el.addEventListener('pointerleave', reset);
            el.addEventListener('pointercancel', reset);
            el.addEventListener('pointerup', reset);
        }

        /* ============ REDES SOCIALES ============ */
        const socialIcons = {
            linkedin: 'linkedin',
            facebook: 'facebook',
            instagram: 'instagram'
        };

        function renderSocial(data) {
            if (!data.social) { socialRow.style.display = 'none'; return; }
            const entries = Object.entries(data.social).filter(([, url]) => url && url.trim() !== '');
            if (entries.length === 0) { socialRow.style.display = 'none'; return; }
            socialRow.innerHTML = entries.map(([key, url]) => `
                <a href="${url}" target="_blank" rel="noopener" aria-label="${key}"
                   class="social-dot theme-btn-neutral w-11 h-11 rounded-full border flex items-center justify-center">
                    <i data-lucide="${socialIcons[key] || 'globe'}" class="w-4.5 h-4.5"></i>
                </a>
            `).join('');
        }

        /* ============ POBLAR DATOS ============ */
        function populate(data) {
            if (!data) {
                // Información genérica cuando no hay empleado seleccionado
                document.title = 'vCard Digital | Global Incom';
                elements.photo.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23e2e8f0" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%2394a3b8" font-size="14" font-family="sans-serif">Sin empleado</text></svg>';
                elements.photo.alt = 'Sin empleado seleccionado';
                elements.name.textContent = 'Selecciona un empleado';
                elements.title.textContent = '';
                elements.company.textContent = 'Global Incom';
                elements.bio.textContent = 'Agrega el parámetro ?employee=clave en la URL para ver la información de un empleado específico.';
                elements.website.href = '#';
                elements.website.textContent = '';
                elements.location.textContent = '';
                elements.call.href = '#';
                elements.whatsapp.href = '#';
                elements.email.href = '#';
                elements.qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(publicProfileUrl)}`;
                socialRow.style.display = 'none';
                return;
            }
            document.title = `${data.fullName} - ${data.title} | Global Incom`;
            elements.photo.src = data.photo;
            elements.photo.alt = data.fullName;
            elements.name.textContent = data.fullName;
            elements.title.textContent = data.title;
            elements.company.textContent = data.company;
            elements.bio.textContent = data.bio || '';
            elements.website.href = data.website;
            elements.website.textContent = data.websiteLabel;
            elements.location.textContent = data.location;
            elements.call.href = `tel:${normalizePhone(data.phone)}`;
            const whatsappMessage = data.whatsappMessage || `Hola ${data.firstName}, te contacto desde tu vCard digital.`;
            elements.whatsapp.href = `https://wa.me/${normalizePhone(data.phone).replace(/^\+/, '')}?text=${encodeURIComponent(whatsappMessage)}`;
            elements.email.href = `mailto:${data.email}`;
            elements.qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(publicProfileUrl)}`;
            renderSocial(data);
        }

        /* ============ EVENTOS ============ */
        elements.save.addEventListener('click', () => { if (employee) downloadVCard(employee); });
        elements.share.addEventListener('click', (e) => { e.preventDefault(); if (employee) shareProfile(employee); });
        elements.copy.addEventListener('click', async () => {
            await navigator.clipboard.writeText(publicProfileUrl);
            elements.copy.innerHTML = '<i data-lucide="check" class="w-4 h-4 mr-2"></i> Copiado';
            lucide.createIcons();
            setTimeout(() => {
                elements.copy.innerHTML = '<i data-lucide="link" class="w-4 h-4 mr-2"></i> Copiar';
                lucide.createIcons();
            }, 1800);
        });

        [elements.call, elements.whatsapp, elements.email, elements.save, elements.share, elements.copy]
            .forEach(attachRipple);

        attachTilt(cardShell);

        /* ============ INICIALIZACIÓN ============ */
        populate(employee);
        setTheme(getPreferredTheme());
        lucide.createIcons();

        // Activar animaciones escalonadas después del primer paint
        requestAnimationFrame(() => {
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('reveal-in'));
        });

        // Ocultar preloader cuando todo esté listo
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden-splash');
            }, 900);
        });

        // Failsafe: si load tarda demasiado, ocultar de todos modos
        setTimeout(() => {
            document.getElementById('splash').classList.add('hidden-splash');
        }, 3500);
    </script>
